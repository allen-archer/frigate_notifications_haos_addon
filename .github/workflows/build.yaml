name: Build and Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            build_from: homeassistant/amd64-base:latest
            platform: linux/amd64
          - arch: aarch64
            build_from: homeassistant/aarch64-base:latest
            platform: linux/arm64
          - arch: armhf
            build_from: homeassistant/armhf-base:latest
            platform: linux/arm/v6
          - arch: armv7
            build_from: homeassistant/armv7-base:latest
            platform: linux/arm/v7
          - arch: i386
            build_from: homeassistant/i386-base:latest
            platform: linux/386
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: BUILD_FROM=${{ matrix.build_from }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:latest